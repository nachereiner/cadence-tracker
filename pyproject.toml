[project]
name = "cadence-tracker"
version = "0.1.0"
description = "Outil personnel local de suivi de la cadence de course (cadence, allure, fréquence cardiaque)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.10",
    "garmin-connect-personal-api-python>=1.0",
    "keyring>=25",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "streamlit>=1.45",
    "typer>=0.12",
]

[project.scripts]
ctrack = "cadence_tracker.cli:app"

[dependency-groups]
dev = [
    "fit-tool>=0.9",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long French UI strings; code is wrapped by `ruff format`
